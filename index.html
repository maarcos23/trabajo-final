<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cajero de Marcos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🛒 Supermercado Cloud</h1>
    <p>Responsable: Marcos</p>

    <div style="display: flex; gap: 20px;">
        
        <div class="productos">
            <h3>Selecciona Productos:</h3>
            <button class="btn-producto" data-nombre="Pan" data-precio="1.20">Pan (1.20€)</button>
            <button class="btn-producto" data-nombre="Leche" data-precio="0.95">Leche (0.95€)</button>
            <button class="btn-producto" data-nombre="Manzana" data-precio="2.50">Manzana (2.50€)</button>
            <button class="btn-producto" data-nombre="Huevos" data-precio="1.80">Huevos (1.80€)</button>
            <button class="btn-producto" data-nombre="Queso" data-precio="3.40">Queso (3.40€)</button>
        </div>

        <div class="ticket">
            <h3>Ticket de Compra</h3>
            <p id="fecha-actual"></p>
            <hr>
            <ul id="lista-compra"></ul>
            <hr>
            <p><strong>TOTAL: <span id="precio-total">0.00</span>€</strong></p>
            <button id="btn-pagar" style="width:100%; padding:10px; background:green; color:white; border:none; cursor:pointer;">
                FINALIZAR Y PAGAR
            </button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
